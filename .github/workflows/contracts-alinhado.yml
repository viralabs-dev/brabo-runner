name: contracts-alinhado

# Confere que a versão do brabo-contracts é a mesma no alias do `package.json` e no lock
# (AT-770, RN-1038). Reutilizável do brabo-ci; NÃO é check obrigatório.
run-name: "contracts-alinhado ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  contracts-alinhado:
    uses: viralabs-dev/brabo-ci/.github/workflows/contracts-alinhado.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
