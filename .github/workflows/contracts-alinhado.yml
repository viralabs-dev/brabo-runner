name: contracts-alinhado

# Confere que a versão do brabo-contracts é a mesma no alias do `package.json` e no lock
# (AT-770, RN-1038). Reutilizável do brabo-ci; NÃO é check obrigatório.
run-name: "contracts-alinhado ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  contracts-alinhado:
    uses: viralabs-dev/brabo-ci/.github/workflows/contracts-alinhado.yml@54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
    with:
      ci_ref: 54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
