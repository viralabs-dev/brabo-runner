name: contracts-alinhado

# Confere que a versão do brabo-contracts é a mesma no alias do `package.json` e no lock
# (AT-770, RN-1038). Reutilizável do brabo-ci; NÃO é check obrigatório.
run-name: "contracts-alinhado ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  contracts-alinhado:
    uses: viralabs-dev/brabo-ci/.github/workflows/contracts-alinhado.yml@a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    with:
      ci_ref: a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
