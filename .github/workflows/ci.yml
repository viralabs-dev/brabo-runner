name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
  packages: read # instala @viralabs-dev/* do GitHub Packages (RN-1039)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Actionlint e pins do brabo-ci (AT-819). Não é check obrigatório.
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  # README no esqueleto e mapa alinhado (AT-826). Informativos, não são checks obrigatórios.
  readme-esqueleto:
    name: README no esqueleto
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  mapa-alinhado:
    name: Mapa dos repos alinhado
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17

  runner:
    name: Lint, tipos, testes, build e smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      # O spec do systemd PULA, nomeando o motivo, quando a máquina não tem systemd --user.
      - run: pnpm test
      - run: pnpm build
      # Exercita o artefato empacotado (dist/index.cjs) que vai para o registry.
      - run: pnpm smoke
