name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
  packages: read # instala @viralabs-dev/* do GitHub Packages (RN-1039)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Actionlint e pins do brabo-ci (AT-819). Não é check obrigatório.
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0

  # README no esqueleto e mapa alinhado (AT-826). Informativos, não são checks obrigatórios.
  readme-esqueleto:
    name: README no esqueleto
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0

  mapa-alinhado:
    name: Mapa dos repos alinhado
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0

  runner:
    name: Lint, tipos, testes, build e smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Bun só para o build:bin/smoke:bin (AT-853); mesma versão e SHA do build-runner-binaries.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.4.0'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      # O spec do systemd PULA, nomeando o motivo, quando a máquina não tem systemd --user.
      - run: pnpm test
      - run: pnpm build
      # Exercita o artefato empacotado (dist/index.cjs) que vai para o registry.
      - run: pnpm smoke
      # Binário linux-x64 que vai para a Release, com --self-test-pty (PTY real, RN-688) (AT-853).
      - run: pnpm build:bin
      - run: pnpm smoke:bin
