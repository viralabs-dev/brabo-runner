name: tag-release

# Carimba a tag a cada merge numa permanente (política do brabo-ci). A tag nasce
# com o token do GitHub App do bot, e não com o `GITHUB_TOKEN`: tag criada com
# este NÃO dispara workflow, e `build-runner-binaries.yml` nunca rodaria.
on:
  push:
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  token:
    name: Token do bot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token: ${{ steps.app.outputs.token }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.BRABO_APP_ID }}
          private-key: ${{ secrets.BRABO_APP_PRIVATE_KEY }}

  carimbar:
    needs: token
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@236dc29d9e64a95ba278bd2ec1109940ce3d6e20  # v1.0.0
    with:
      ci_ref: 236dc29d9e64a95ba278bd2ec1109940ce3d6e20
    secrets:
      BOT_TOKEN: ${{ needs.token.outputs.token }}
