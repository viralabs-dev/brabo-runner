name: tag-release

# Carimba a tag a cada merge numa permanente (política do brabo-ci). A tag nasce
# com o token do GitHub App (gerado no reutilizável), e não com o `GITHUB_TOKEN`: tag criada com
# este NÃO dispara workflow, e `build-runner-binaries.yml` nunca rodaria.
on:
  push:
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: write
  issues: write # o tag-release do brabo-ci declara (gate e PRs de retropropagação)

jobs:
  carimbar:
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    with:
      ci_ref: a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
