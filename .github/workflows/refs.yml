name: refs

# Confere as refs `caminho:N` (`símbolo`) das RNs no próprio PR (AT-782). Reutilizável do brabo-ci;
# ref interna quebrada reprova, o artefato `refs-patch` traz a reancoragem. NÃO é check obrigatório.
run-name: "refs ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  refs:
    uses: viralabs-dev/brabo-ci/.github/workflows/refs-com-simbolo.yml@b5df60b6e114827dd3a59889d6a4b0ecda730ecc  # v1.4.0-dev.14
    with:
      ci_ref: b5df60b6e114827dd3a59889d6a4b0ecda730ecc  # v1.4.0-dev.14
