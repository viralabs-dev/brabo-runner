name: refs

# Confere as refs `caminho:N` (`símbolo`) das RNs no próprio PR (AT-782). Reutilizável do brabo-ci;
# ref interna quebrada reprova, o artefato `refs-patch` traz a reancoragem. NÃO é check obrigatório.
run-name: "refs ← #${{ github.event.pull_request.number }} (${{ github.head_ref }})"

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  refs:
    uses: viralabs-dev/brabo-ci/.github/workflows/refs-com-simbolo.yml@54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
    with:
      ci_ref: 54dc896bbcd3cb5cbb6f0717825031f24152b8f0  # v1.4.0-dev.13
