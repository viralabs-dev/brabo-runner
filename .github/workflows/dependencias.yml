name: dependencias

# Check "Dependências de merge" (AT-787): espera as PRs citadas em `Depende-de: viralabs-dev/<repo>#<n>` no corpo.
# O reutilizável publica o check pelo App e nunca reprova o job (continue-on-error).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  dependencias:
    uses: viralabs-dev/brabo-ci/.github/workflows/dependencias-de-merge.yml@b5df60b6e114827dd3a59889d6a4b0ecda730ecc  # v1.4.0-dev.14
    with:
      ci_ref: b5df60b6e114827dd3a59889d6a4b0ecda730ecc  # v1.4.0-dev.14
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
