# `node-pty` é binding NATIVO de verdade (compila com node-gyp no postinstall):
# sem o build, o terminal interativo do runner não existe. `esbuild` é o do tsup.
allowBuilds:
  esbuild: true
  'node-pty': true
# Pacotes da própria org (brabo-contracts) valem logo após a publicação: a idade mínima
# protege de terceiros, e o publish é só pela tag do nosso workflow (AT-770).
minimumReleaseAgeExclude:
  - '@viralabs-dev/*'
